spring.application.name=au-connect
server.port=8080

# ---- Database (default: file-based H2, no setup needed) ----
spring.datasource.url=jdbc:h2:file:./data/auconnect;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# For MySQL, comment the H2 lines above and use:
# spring.datasource.url=jdbc:mysql://localhost:3306/auconnect?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=your_password

# ---- Uploads ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-dir=uploads

# ---- Security ----
# Base64 secret, at least 32 bytes. CHANGE THIS before deploying (set APP_JWT_SECRET env var).
app.jwt.secret=${APP_JWT_SECRET:YXUtY29ubmVjdC1kZXYtc2VjcmV0LWNoYW5nZS1tZS1iZWZvcmUtZGVwbG95aW5nISE=}
app.jwt.expiration-ms=86400000
app.allowed-email-domain=anurag.edu.in
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# Default admin account created on first start. CHANGE THE PASSWORD.
app.admin.email=${APP_ADMIN_EMAIL:admin@anurag.edu.in}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@12345}

# ---- Email verification ----
# With no SMTP host configured, the verification link is printed in the server log
# and returned in the register response (dev-mode only). Set dev-mode=false in production.
app.dev-mode=${APP_DEV_MODE:true}
app.mail-from=${APP_MAIL_FROM:no-reply@anurag.edu.in}
# Uncomment and fill in to send real emails (e.g. Gmail SMTP with an app password):
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=your_account@gmail.com
# spring.mail.password=your_app_password
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
